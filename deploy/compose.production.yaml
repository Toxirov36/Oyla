services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: oyla
      POSTGRES_DB: oyla
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
    volumes: ['pgdata:/var/lib/postgresql']
    ports: ['127.0.0.1:5432:5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U oyla -d oyla']
      interval: 5s
      retries: 20
    logging: &logs
      driver: json-file
      options: { max-size: '10m', max-file: '3' }
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD required}
    command: ['sh', '-c', 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    volumes: ['redisdata:/data']
    healthcheck:
      test: ['CMD-SHELL', 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 5s
      retries: 20
    logging: *logs
  api:
    image: ${IMAGE_PREFIX:?IMAGE_PREFIX required}-api:${DEPLOY_SHA:?DEPLOY_SHA required}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://oyla:${POSTGRES_PASSWORD}@postgres:5432/oyla?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required}
      WEB_ORIGIN: ${WEB_ORIGIN:?WEB_ORIGIN required}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      NODE_ENV: production
      TRUST_PROXY: '1'
      PORT: 3001
      AUTH_RATE_LIMIT: '20'
      API_RATE_LIMIT: '240'
    ports: ['127.0.0.1:3001:3001']
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3001/api/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      start_period: 60s
      retries: 5
    logging: *logs
  web:
    image: ${IMAGE_PREFIX}-web:${DEPLOY_SHA}
    restart: unless-stopped
    ports: ['127.0.0.1:${WEB_PORT:-8080}:80']
    depends_on:
      api: { condition: service_healthy }
    logging: *logs
volumes:
  pgdata:
  redisdata:

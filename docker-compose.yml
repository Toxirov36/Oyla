services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: oyla
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-oyla_local_password}
      POSTGRES_DB: oyla
    ports: ['127.0.0.1:55432:5432']
    volumes: ['pgdata:/var/lib/postgresql']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U oyla']
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ['127.0.0.1:56379:6379']
    command: ['redis-server', '--appendonly', 'yes']
    volumes: ['redisdata:/data']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 10
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://oyla:${POSTGRES_PASSWORD:-oyla_local_password}@postgres:5432/oyla?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?Set a random JWT_SECRET}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:8080}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      NODE_ENV: ${NODE_ENV:-development}
      TRUST_PROXY: '1'
      PORT: 3001
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports: ['8080:80']
    depends_on: [api]
volumes:
  pgdata:
  redisdata:

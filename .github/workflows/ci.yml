name: OYLA quality checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: oyla
          POSTGRES_PASSWORD: ci_database_only
          POSTGRES_DB: oyla_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U oyla -d oyla_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql://oyla:ci_database_only@127.0.0.1:5432/oyla_test?schema=public
      REDIS_URL: redis://127.0.0.1:6379
      JWT_SECRET: ci_only_test_secret_never_use_for_deployment_2026
      WEB_ORIGIN: http://localhost:5173
      NODE_ENV: test
      DEMO_PASSWORD: OylaCiTesting2026!
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: API integration tests
        shell: bash
        run: |
          npm run start -w @oyla/api > .local/ci-api.log 2>&1 &
          API_PID=$!
          trap 'kill "$API_PID" 2>/dev/null || true' EXIT
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3001/api/v1/health > /dev/null; then break; fi
            sleep 1
          done
          npm run test:e2e
      - name: Dependency audit
        shell: bash
        run: |
          mkdir -p .local
          if npm audit --audit-level=high --json > .local/npm-audit.json; then
            exit 0
          fi
          node scripts/audit.mjs .local/npm-audit.json
      - name: Browser failure diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: browser-test-diagnostics
          path: |
            playwright-report/
            test-results/
            .local/npm-audit.json
          retention-days: 7

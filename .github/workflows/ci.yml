name: OYLA quality checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: oyla
          POSTGRES_PASSWORD: ci_database_only
          POSTGRES_DB: oyla_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U oyla -d oyla_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql://oyla:ci_database_only@127.0.0.1:5432/oyla_test?schema=public
      REDIS_URL: redis://127.0.0.1:6379
      JWT_SECRET: ci_only_test_secret_never_use_for_deployment_2026
      WEB_ORIGIN: http://localhost:5173
      NODE_ENV: test
      DEMO_PASSWORD: OylaCiTesting2026!
      AUTH_RATE_LIMIT: '1000'
      API_RATE_LIMIT: '3000'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm ci --prefix deploy/ops
      - run: npm test --prefix deploy/ops
      - run: npm audit --prefix deploy/ops --audit-level=high
      - run: npm run db:generate
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: API integration tests
        shell: bash
        run: |
          npm run start -w @oyla/api > .local/ci-api.log 2>&1 &
          API_PID=$!
          trap 'kill "$API_PID" 2>/dev/null || true' EXIT
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3001/api/v1/health > /dev/null; then break; fi
            sleep 1
          done
          npm run test:e2e
      - name: Dependency audit
        shell: bash
        run: |
          mkdir -p .local
          if npm audit --audit-level=high --json > .local/npm-audit.json; then
            exit 0
          fi
          node scripts/audit.mjs .local/npm-audit.json
      - name: Browser failure diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: browser-test-diagnostics
          path: |
            playwright-report/
            test-results/
            .local/npm-audit.json
          retention-days: 7
  images:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Build, validate and publish production images
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          registry="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for service in api web; do
            docker build --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              -f "apps/$service/Dockerfile" -t "$registry-$service:$GITHUB_SHA" .
            if [[ "$service" == api ]]; then
              docker run --rm --entrypoint node "$registry-$service:$GITHUB_SHA" -e \
                "require.resolve('@nestjs/core'); require.resolve('@prisma/adapter-pg'); require('fs').accessSync('dist/src/main.js'); try { require.resolve('react'); process.exit(1); } catch(e) { if(e.code!=='MODULE_NOT_FOUND') throw e; }"
              docker run --rm -e DATABASE_URL=postgresql://verify:verify@localhost:5432/verify --entrypoint node "$registry-$service:$GITHUB_SHA" scripts/prisma.mjs --version
            fi
            docker push "$registry-$service:$GITHUB_SHA"
          done
  deploy:
    needs: images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.OYLA_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    concurrency:
      group: oyla-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Configure SSH and release tested commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9.-]+$ && "$DEPLOY_USER" =~ ^[a-zA-Z0-9_-]+$ ]]
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          latest=$(curl --fail --silent -H "Authorization: Bearer $GH_TOKEN" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/ref/heads/main" | jq -r '.object.sha')
          [[ "$latest" == "$GITHUB_SHA" ]] || exit 0
          git archive --format=tar.gz --output="$RUNNER_TEMP/release.tar.gz" "$GITHUB_SHA"
          target="$DEPLOY_USER@$DEPLOY_HOST"
          ssh_opts=(-o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15)
          ssh "${ssh_opts[@]}" "$target" 'mkdir -p ~/oyla/incoming'
          scp "${ssh_opts[@]}" "$RUNNER_TEMP/release.tar.gz" "$target:oyla/incoming/$GITHUB_SHA.tar.gz"
          scp "${ssh_opts[@]}" deploy/release.sh "$target:oyla/incoming/$GITHUB_SHA.sh"
          printf '%s' "$GH_TOKEN" | ssh "${ssh_opts[@]}" "$target" "bash ~/oyla/incoming/$GITHUB_SHA.sh '$GITHUB_SHA' 'ghcr.io/${GITHUB_REPOSITORY,,}' '$GITHUB_ACTOR'"
          [[ "$(ssh -n "${ssh_opts[@]}" "$target" 'cat ~/oyla/deployed-sha')" == "$GITHUB_SHA" ]]
      - name: Remove runner SSH credentials
        if: always()
        run: rm -f ~/.ssh/id_ed25519 ~/.ssh/known_hosts
